<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Arquitectura — Blueprint</title>
  <style>
    :root {
      --bg-color: #080c14;
      --canvas-bg: #080c14;
      --grid-minor: #0e1726;
      --grid-major: #1b283d;
      --header-bg: #0c1424;
      --sidebar-bg: #0a101d;
      --card-bg: #0f192c;
      --card-title: #f8fafc;
      --card-sub: #94a3b8;
      --border-color: #1e293b;
      --boundary-fill: rgba(14, 23, 42, 0.45);
      --boundary-border: #334155;
      --boundary-pill-bg: #0b1326;
      --boundary-pill-text: #38bdf8;
      --edge-stroke: #38bdf8;
      --edge-pill-bg: #080e1c;
      --edge-pill-text: #cbd5e1;
      --edge-pill-border: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #06b6d4;
      --panel-bg: #0f172a;
      --hover-highlight: #38bdf8;
      --dim-opacity: 0.22;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --canvas-bg: #f8fafc;
      --grid-minor: #e2e8f0;
      --grid-major: #cbd5e1;
      --header-bg: #ffffff;
      --sidebar-bg: #f1f5f9;
      --card-bg: #ffffff;
      --card-title: #0f172a;
      --card-sub: #475569;
      --border-color: #cbd5e1;
      --boundary-fill: rgba(241, 245, 249, 0.65);
      --boundary-border: #94a3b8;
      --boundary-pill-bg: #f1f5f9;
      --boundary-pill-text: #0284c7;
      --edge-stroke: #0284c7;
      --edge-pill-bg: #ffffff;
      --edge-pill-text: #334155;
      --edge-pill-border: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-cyan: #0284c7;
      --panel-bg: #ffffff;
      --hover-highlight: #0284c7;
      --dim-opacity: 0.28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Top cyan accent bar */
    .top-accent-bar {
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
      flex-shrink: 0;
    }

    /* Main header */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .doc-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .badge-archify {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.35);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .doc-stats {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-sep {
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .search-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-primary);
    }

    .search-shortcut {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      background: rgba(148, 163, 184, 0.15);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent-cyan);
    }

    .btn.active {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* View bar / Breadcrumbs */
    .view-bar {
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .view-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .view-tab {
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .view-tab:hover {
      color: var(--text-primary);
      background: rgba(148, 163, 184, 0.08);
    }

    .view-tab.active {
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      border-color: rgba(6, 182, 212, 0.3);
    }

    .breadcrumbs {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
    }

    .breadcrumbs.visible {
      display: flex;
    }

    .breadcrumb-item {
      color: var(--text-muted);
      cursor: pointer;
    }

    .breadcrumb-item:hover {
      color: var(--accent-cyan);
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: var(--text-muted);
    }

    .breadcrumb-current {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .breadcrumb-back-btn {
      padding: 2px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-secondary);
      cursor: pointer;
      margin-left: 8px;
    }

    .breadcrumb-back-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-primary);
    }

    /* Main container: sidebar + canvas */
    .app-body {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease, width 0.2s ease;
      overflow-y: auto;
    }

    .sidebar.collapsed {
      width: 0;
      transform: translateX(-100%);
      border-right: none;
    }

    .sidebar-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 5px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .nav-item:hover {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .nav-item-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      background: rgba(148, 163, 184, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    /* Canvas area */
    .canvas-container {
      flex: 1;
      position: relative;
      background-color: var(--canvas-bg);
      overflow: hidden;
      cursor: grab;
    }

    .canvas-container:active {
      cursor: grabbing;
    }

    svg#blueprint-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Canvas floating controls */
    .canvas-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .control-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.12s;
    }

    .control-btn:hover {
      background: rgba(148, 163, 184, 0.15);
      color: var(--accent-cyan);
    }

    /* Canvas Legend */
    .canvas-legend {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(11, 17, 30, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.72rem;
      z-index: 5;
      flex-wrap: wrap;
      max-width: calc(100% - 100px);
    }

    [data-theme="light"] .canvas-legend {
      background: rgba(255, 255, 255, 0.88);
    }

    .legend-title {
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    /* Bottom Info Inspector (Cards / Invariants / ADRs) */
    .inspector-panel {
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      max-height: 280px;
      min-height: 50px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: max-height 0.2s ease;
      overflow: hidden;
    }

    .inspector-panel.minimized {
      max-height: 38px;
    }

    .inspector-header {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: var(--header-bg);
      cursor: pointer;
    }

    .inspector-title {
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inspector-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inspector-tab {
      padding: 3px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .inspector-tab.active {
      background: rgba(6, 182, 212, 0.12);
      border-color: rgba(6, 182, 212, 0.3);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .inspector-content {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
    }

    /* Inspector cards layout */
    .flow-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .flow-cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .meta-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
    }

    .meta-card-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 6px;
    }

    .meta-card-content {
      font-size: 0.82rem;
      color: var(--text-primary);
      line-height: 1.45;
    }

    .script-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border-color);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--accent-cyan);
      margin-right: 6px;
      margin-top: 4px;
    }

    /* Table styles for Invariants & ADRs */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .data-table th, .data-table td {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .data-table th {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-secondary);
      font-weight: 600;
    }

    .data-table tr:hover td {
      background: rgba(148, 163, 184, 0.04);
    }

    /* Search Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding-top: 80px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .search-modal {
      width: 580px;
      max-width: 90vw;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .search-input-box {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.95rem;
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .search-results {
      max-height: 360px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .search-result-item {
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background 0.12s;
    }

    .search-result-item:hover, .search-result-item.selected {
      background: rgba(6, 182, 212, 0.14);
    }

    .search-result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .search-result-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .search-result-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-secondary);
    }

    .search-result-desc {
      font-size: 0.76rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* SVG Diagram Classes */
    .arch-boundary rect.boundary-box {
      fill: var(--boundary-fill);
      stroke: var(--boundary-border);
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      transition: stroke 0.2s;
    }

    .arch-boundary rect.boundary-pill {
      fill: var(--boundary-pill-bg);
      stroke: var(--boundary-border);
      stroke-width: 1;
    }

    .arch-boundary text.boundary-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      fill: var(--boundary-pill-text);
      dominant-baseline: central;
    }

    .arch-node {
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .arch-node rect.node-card {
      fill: var(--card-bg);
      stroke-width: 1.5;
      rx: 8;
      transition: stroke-width 0.15s, filter 0.15s;
    }

    .arch-node:hover rect.node-card {
      stroke-width: 2.5;
      filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.4));
    }

    .arch-node text.node-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      fill: var(--card-title);
      dominant-baseline: central;
    }

    .arch-node text.node-sublabel {
      font-family: var(--font-sans);
      font-size: 11px;
      fill: var(--card-sub);
      dominant-baseline: central;
    }

    .arch-edge path.edge-line {
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-width 0.15s, stroke 0.15s, opacity 0.2s;
    }

    .arch-edge.live path.edge-line {
      stroke-dasharray: 8 6;
      animation: flowDash 1.2s linear infinite;
    }

    @keyframes flowDash {
      to {
        stroke-dashoffset: -28;
      }
    }

    .arch-edge rect.edge-pill {
      fill: var(--edge-pill-bg);
      stroke: var(--edge-pill-border);
      stroke-width: 1;
      rx: 5;
    }

    .arch-edge text.edge-label {
      font-family: var(--font-mono);
      font-size: 10px;
      fill: var(--edge-pill-text);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Trace highlight & dimming */
    .dimmed {
      opacity: var(--dim-opacity) !important;
    }

    .highlighted {
      opacity: 1 !important;
    }

    .highlighted rect.node-card {
      stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 10px var(--accent-cyan)) !important;
    }

    .highlighted path.edge-line {
      stroke-width: 2.8 !important;
      stroke: var(--hover-highlight) !important;
    }

    /* Sequence Diagram Styling */
    .seq-lifeline {
      stroke: var(--border-color);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    .seq-box {
      fill: rgba(148, 163, 184, 0.04);
      stroke: var(--border-color);
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
    }

    .seq-box-pill {
      fill: var(--card-bg);
      stroke: var(--border-color);
      stroke-width: 1;
    }

    .seq-box-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      fill: var(--accent-cyan);
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="top-accent-bar"></div>

  <header>
    <div class="header-left">
      <div class="title-row">
        <h1 class="doc-title" id="ui-doc-title">Arquitectura del Sistema</h1>
        <span class="badge-archify">ARCHIFY BLUEPRINT</span>
      </div>
      <div class="doc-stats" id="ui-doc-stats">
        <span>0 flujos</span>
        <span class="stat-sep">·</span>
        <span>0 componentes</span>
        <span class="stat-sep">·</span>
        <span>0 invariantes</span>
        <span class="stat-sep">·</span>
        <span>0 ADRs</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="search-btn" id="btn-search" title="Buscar (Ctrl+K o /)">
        <span>🔍 Buscar</span>
        <span class="search-shortcut">Ctrl+K</span>
      </button>

      <button class="btn" id="btn-theme" title="Alternar tema oscuro / claro">
        <span id="theme-icon">☀️</span> <span id="theme-text">LIGHT</span>
      </button>

      <button class="btn" id="btn-live" title="Animación de flujo por conectores">

    {
      "decision": "Hooks de Claude Code + puente opencode compartiendo módulos CJS",
      "alternative": "Reimplementar la lógica de modo por herramienta",
      "rationale": "Una sola fuente de verdad; menos superficie de bugs"
    },
    {
      "decision": "Recordatorio ambiental liviano (texto estático por modo)",
      "alternative": "Escanear git diff/tareas.md en cada turno",
      "rationale": "Más barato, y la verificación real ya vive en `verificar-dod`/`auditar-coherencia`/`testear`"
    },
    {
      "decision": "`CLAUDE.md`/`AGENTS.md` generados completos desde un solo cuerpo",
      "alternative": "Uno canónico + el otro puntero",
      "rationale": "El puntero se rompía si solo se generaba el archivo no-canónico (bug real encontrado y corregido)"
    },
    {
      "decision": "`docs/plan`/`docs/task` locales (gitignored) también en este propio repo",
      "alternative": "Versionarlos aquí para transparencia de colaboradores",
      "rationale": "Revisado en 1.2.0: el tablero se regenera con `tablero.py --indice` y el plan cambia por Tarea — versionarlos generaba ruido constante; el historial relevante vive en los commits de código/docs"
    },
    {
      "decision": "Servers MCP opt-in por proyecto (`init`), `.mcp.json` del plugin vacío",
      "alternative": "`codegraphcontext` global en el plugin",
      "rationale": "Ningún harness arranca servers stdio de forma perezosa: un MCP global es un proceso en cada sesión de cada repo, se use o no"
    },
    {
      "decision": "Manifiesto `plugin.json` raíz para Antigravity",
      "alternative": "Asumir que `gemini-extension.json` seguía sirviendo al sucesor",
      "rationale": "`agy plugin validate` exige el manifiesto raíz (verificado con agy 1.3.4): sin él, la instalación falla; Gemini CLI quedó legacy (sunset consumer 18-jun-2026, enterprise/API-key vigentes)"
    },
    {
      "decision": "Visores HTML compañeros (`diseno_db.html` base drawDB y `architecture.html` base Archify multi-vista) compilados desde `.md` con Python stdlib",
      "alternative": "Empaquetar el editor React de drawDB o exigir JSONs con coordenadas manuales de Archify",
      "rationale": "Mantiene el `.md` como única fuente de verdad sin duplicación ni dependencias externas, soporta arquitecturas extensas mediante auto-layout por capas y drill-down de flujos, y valida sincronía en ms con `--check` (SHA-256)"
    }
  ],

      "subtitle": "Ningún harness arranca servers stdio de forma perezosa: un MCP global es un proceso en cada sesión de cada repo, se use o no",
      "category": "adr",
      "targetViewId": "adrs"
    },
    {
      "id": "adr-Manifiesto `plugin.json` raíz ",
      "title": "Manifiesto `plugin.json` raíz para Antigravity",
      "subtitle": "`agy plugin validate` exige el manifiesto raíz (verificado con agy 1.3.4): sin él, la instalación falla; Gemini CLI quedó legacy (sunset consumer 18-jun-2026, enterprise/API-key vigentes)",
      "category": "adr",
      "targetViewId": "adrs"
    },
    {
      "id": "adr-Visores HTML compañeros (`dise",
      "title": "Visores HTML compañeros (`diseno_db.html` base drawDB y `architecture.html` base Archify multi-vista) compilados desde `.md` con Python stdlib",
      "subtitle": "Mantiene el `.md` como única fuente de verdad sin duplicación ni dependencias externas, soporta arquitecturas extensas mediante auto-layout por capas y drill-down de flujos, y valida sincronía en ms con `--check` (SHA-256)",
      "category": "adr",
      "targetViewId": "adrs"
    }
  ]
}
  </script>
  <!-- ARCH_DATA_END -->

  <script>
    /* =====================================================================
       ARCHIFY BLUEPRINT CLIENT RUNTIME
       Multi-view explorer, Pan & Zoom, Semantic Card Renderer,
       Orthogonal Edges, Hover Tracing, Search & Drill-Down
       ===================================================================== */
    (function() {
      "use strict";

      // 1. Load Architecture Data
      let DATA = {
        meta: { title: "Arquitectura", flows_count: 0, components_count: 0, invariants_count: 0, adrs_count: 0 },
        views: [],
        flows_index: [],
        adrs: [],
        search_index: []
      };

      try {
        const rawJson = document.getElementById("arch-data").textContent;
        DATA = JSON.parse(rawJson);
      } catch (err) {
        console.error("Error al cargar JSON de arquitectura:", err);
      }

      // 2. Application State
      const STATE = {
        currentViewId: null,
        previousViewId: null,
        viewsById: {},
        theme: document.documentElement.getAttribute("data-theme") || "dark",
        liveMode: false,
        sidebarOpen: true,
        panZoom: {
          scale: 1,
          x: 0,
          y: 0,
          isPanning: false,
          startX: 0,
          startY: 0
        },
        inspectorTab: "flow-summary",
        inspectorOpen: true,
        searchQuery: "",
        selectedSearchIdx: 0
      };

      DATA.views.forEach(v => {
        STATE.viewsById[v.id] = v;
      });

      // Role styling and colors
      const ROLE_PALETTE = {
        frontend: { color: "#06b6d4", label: "Frontend / Actor", icon: "👤" },
        backend: { color: "#10b981", label: "Backend / Proceso", icon: "⚙️" },
        database: { color: "#8b5cf6", label: "Base de Datos / Modelo", icon: "🗄️" },
        cloud: { color: "#eab308", label: "Cloud / Fuente", icon: "☁️" },
        security: { color: "#f43f5e", label: "Seguridad / Guardrail", icon: "🛡️" },
        "message-bus": { color: "#f97316", label: "Message Bus / Salida", icon: "📨" },
        external: { color: "#64748b", label: "Sistema Externo", icon: "🌐" }
      };

      // DOM Elements
      const dom = {
        docTitle: document.getElementById("ui-doc-title"),
        docStats: document.getElementById("ui-doc-stats"),
        viewTabs: document.getElementById("ui-view-tabs"),
        breadcrumbs: document.getElementById("ui-breadcrumbs"),
        bcHome: document.getElementById("bc-home"),
        bcCurrent: document.getElementById("bc-current"),
        btnBcBack: document.getElementById("btn-bc-back"),
        sidebar: document.getElementById("ui-sidebar"),
        navSystemViews: document.getElementById("nav-system-views"),
        navFlowsList: document.getElementById("nav-flows-list"),
        navMetaViews: document.getElementById("nav-meta-views"),
        flowsCountBadge: document.getElementById("sidebar-flows-count"),
        canvasContainer: document.getElementById("canvas-container"),
        canvasSvg: document.getElementById("blueprint-canvas"),
        viewportGroup: document.getElementById("viewport-group"),
        legend: document.getElementById("ui-legend"),
        inspectorPanel: document.getElementById("inspector-panel"),
        inspectorHeader: document.getElementById("inspector-header"),
        inspectorTabs: document.getElementById("inspector-tabs"),
        inspectorContent: document.getElementById("inspector-content"),
        inspectorToggleIcon: document.getElementById("inspector-toggle-icon"),
        btnSearch: document.getElementById("btn-search"),
        searchModal: document.getElementById("search-modal"),
        searchInput: document.getElementById("search-input"),
        searchResults: document.getElementById("search-results"),
        btnTheme: document.getElementById("btn-theme"),
        themeIcon: document.getElementById("theme-icon"),
        themeText: document.getElementById("theme-text"),
        btnLive: document.getElementById("btn-live"),
        btnExportSvg: document.getElementById("btn-export-svg"),
        btnExportPng: document.getElementById("btn-export-png"),
        btnZoomIn: document.getElementById("btn-zoom-in"),
        btnZoomOut: document.getElementById("btn-zoom-out"),
        btnZoomFit: document.getElementById("btn-zoom-fit"),
        btnToggleSidebar: document.getElementById("btn-toggle-sidebar")
      };

      // 3. Initialization
      function init() {
        // Document Meta
        if (DATA.meta) {
          dom.docTitle.textContent = DATA.meta.title || "Arquitectura del Sistema";
          dom.docStats.innerHTML = `
            <span>${DATA.meta.flows_count || DATA.flows_index.length} flujos</span>
            <span class="stat-sep">·</span>
            <span>${DATA.meta.components_count || 0} componentes</span>
            <span class="stat-sep">·</span>
            <span>${DATA.meta.invariants_count || 0} invariantes</span>
            <span class="stat-sep">·</span>
            <span>${DATA.meta.adrs_count || DATA.adrs.length} ADRs</span>
          `;
          if (dom.flowsCountBadge) {
            dom.flowsCountBadge.textContent = DATA.flows_index.length;
          }
        }

        renderNavigation();
        setupEventListeners();
        setupPanZoom();

        // Default to Master Map or first view
        const defaultView = DATA.views.find(v => v.id === "mapa-maestro") || DATA.views[0];
        if (defaultView) {
          selectView(defaultView.id, false);
        }
      }

      // 4. Render Navigation Controls
      function renderNavigation() {
        // Primary View Tabs
        dom.viewTabs.innerHTML = "";
        DATA.views.forEach(v => {
          if (v.is_flow) return; // Flow views accessed via dropdown or sidebar
          const tab = document.createElement("button");
          tab.className = "view-tab";
          tab.textContent = v.name;
          tab.setAttribute("data-view-id", v.id);
          tab.addEventListener("click", () => selectView(v.id, true));
          dom.viewTabs.appendChild(tab);
        });

        // Sidebar Navigation
        dom.navSystemViews.innerHTML = "";
        dom.navFlowsList.innerHTML = "";
        dom.navMetaViews.innerHTML = "";

        DATA.views.forEach(v => {
          const item = document.createElement("li");
          item.className = "nav-item";
          item.setAttribute("data-view-id", v.id);

          if (v.is_flow) {
            item.innerHTML = `
              <span>${v.name}</span>
              <span class="nav-item-badge">${v.components ? v.components.length : 0}</span>
            `;
            item.addEventListener("click", () => selectView(v.id, true));
            dom.navFlowsList.appendChild(item);
          } else if (v.id === "adrs" || v.id === "despliegue") {
            item.innerHTML = `
              <span>${v.name}</span>
              <span class="nav-item-badge">${v.badge || ""}</span>
            `;
            item.addEventListener("click", () => selectView(v.id, true));
            dom.navMetaViews.appendChild(item);
          } else {
            item.innerHTML = `
              <span>${v.name}</span>
              <span class="nav-item-badge">${v.components ? v.components.length : 0}</span>
            `;
            item.addEventListener("click", () => selectView(v.id, true));
            dom.navSystemViews.appendChild(item);
          }
        });
      }

      // 5. Select & Render View
      function selectView(viewId, pushBreadcrumb) {
        const view = STATE.viewsById[viewId];
        if (!view) return;

        if (pushBreadcrumb && view.is_flow) {
          STATE.previousViewId = STATE.currentViewId || "mapa-maestro";
        }
        STATE.currentViewId = viewId;

        // Update Tab active classes
        document.querySelectorAll(".view-tab, .nav-item").forEach(el => {
          if (el.getAttribute("data-view-id") === viewId) {
            el.classList.add("active");
          } else {
            el.classList.remove("active");
          }
        });

        // Breadcrumb updates
        if (view.is_flow) {
          dom.breadcrumbs.classList.add("visible");
          dom.bcCurrent.textContent = view.name;
        } else {
          dom.breadcrumbs.classList.remove("visible");
        }

        // Render Canvas content according to diagram type
        renderCanvas(view);

        // Render Inspector
        renderInspector(view);

        // Auto-fit to viewport
        requestAnimationFrame(() => {
          fitCanvas();
        });
      }

      // 6. Canvas Renderer (Flowchart / Sequence / ADRs)
      function renderCanvas(view) {
        dom.viewportGroup.innerHTML = "";

        if (view.diagram_type === "sequence") {
          renderSequenceDiagram(view);
        } else {
          renderFlowchartDiagram(view);
        }

        renderLegend(view);
      }

      // Render Flowchart Diagram
      function renderFlowchartDiagram(view) {
        const components = view.components || [];
        const boundaries = view.boundaries || [];
        const connections = view.connections || [];

        // 1. Render Boundaries (Dashed rects + pills)
        boundaries.forEach(b => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.className.baseVal = "arch-boundary";
          g.setAttribute("data-id", b.id);

          const color = b.color || "var(--boundary-border)";

          // Boundary rect
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.className.baseVal = "boundary-box";
          rect.setAttribute("x", b.x);
          rect.setAttribute("y", b.y);
          rect.setAttribute("width", b.width);
          rect.setAttribute("height", b.height);
          rect.setAttribute("rx", "10");
          if (b.color) {
            rect.style.stroke = b.color;
          }
          g.appendChild(rect);

          // Boundary pill (Top Edge Label)
          const pillText = b.label || b.id;
          const pillWidth = Math.max(80, pillText.length * 7.5 + 24);
          const pillHeight = 22;
          const pillX = b.x + 16;
          const pillY = b.y - pillHeight / 2;

          const pill = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          pill.className.baseVal = "boundary-pill";
          pill.setAttribute("x", pillX);
          pill.setAttribute("y", pillY);
          pill.setAttribute("width", pillWidth);
          pill.setAttribute("height", pillHeight);
          pill.setAttribute("rx", "6");
          if (b.color) {
            pill.style.stroke = b.color;
          }
          g.appendChild(pill);

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.className.baseVal = "boundary-label";
          text.setAttribute("x", pillX + 12);
          text.setAttribute("y", pillY + pillHeight / 2);
          text.textContent = pillText;
          if (b.color) {
            text.style.fill = b.color;
          }
          g.appendChild(text);

          dom.viewportGroup.appendChild(g);
        });

        // 2. Render Connections (Edges + Orthogonal lines + pills)
        connections.forEach(conn => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.className.baseVal = "arch-edge" + (STATE.liveMode ? " live" : "");
          g.setAttribute("data-from", conn.from);
          g.setAttribute("data-to", conn.to);

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.className.baseVal = "edge-line";
          path.setAttribute("d", conn.path || "");
          const strokeColor = conn.color || "var(--edge-stroke)";
          path.style.stroke = strokeColor;
          if (conn.dashed) {
            path.style.strokeDasharray = "5 4";
          }
          path.setAttribute("marker-end", "url(#arrow-cyan)");
          if (conn.bidirectional) {
            path.setAttribute("marker-start", "url(#arrow-cyan)");
          }
          g.appendChild(path);

          // Connection Label Pill
          if (conn.label && conn.labelAt) {
            const labelStr = conn.label;
            const pillW = Math.max(50, labelStr.length * 6.8 + 16);
            const pillH = 18;
            const px = conn.labelAt.x - pillW / 2;
            const py = conn.labelAt.y - pillH / 2;

            const pillRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            pillRect.className.baseVal = "edge-pill";
            pillRect.setAttribute("x", px);
            pillRect.setAttribute("y", py);
            pillRect.setAttribute("width", pillW);
            pillRect.setAttribute("height", pillH);
            g.appendChild(pillRect);

            const labelTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            labelTxt.className.baseVal = "edge-label";
            labelTxt.setAttribute("x", conn.labelAt.x);
            labelTxt.setAttribute("y", conn.labelAt.y);
            labelTxt.textContent = labelStr;
            g.appendChild(labelTxt);
          }

          dom.viewportGroup.appendChild(g);
        });

        // 3. Render Component Cards
        components.forEach(comp => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.className.baseVal = "arch-node";
          g.setAttribute("data-id", comp.id);
          if (comp.targetViewId) {
            g.setAttribute("data-target-view", comp.targetViewId);
          }

          const roleInfo = ROLE_PALETTE[comp.role] || ROLE_PALETTE.backend;
          const borderColor = comp.color || roleInfo.color;

          // Main Card
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.className.baseVal = "node-card";
          rect.setAttribute("x", comp.x);
          rect.setAttribute("y", comp.y);
          rect.setAttribute("width", comp.width);
          rect.setAttribute("height", comp.height);
          rect.style.stroke = borderColor;
          g.appendChild(rect);

          // Role indicator pill / icon
          const iconTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          iconTxt.setAttribute("x", comp.x + 14);
          iconTxt.setAttribute("y", comp.y + 22);
          iconTxt.setAttribute("font-size", "12");
          iconTxt.textContent = comp.icon || roleInfo.icon;
          g.appendChild(iconTxt);

          // Component Title
          const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
          title.className.baseVal = "node-title";
          title.setAttribute("x", comp.x + 36);
          title.setAttribute("y", comp.y + 22);
          title.textContent = comp.label || comp.id;
          g.appendChild(title);

          // Sublabel / Tech Stack
          if (comp.sublabel) {
            const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
            sub.className.baseVal = "node-sublabel";
            sub.setAttribute("x", comp.x + 14);
            sub.setAttribute("y", comp.y + comp.height - 18);
            sub.textContent = comp.sublabel;
            g.appendChild(sub);
          }

          // Drill-down indicator if card targets another view
          if (comp.targetViewId) {
            const drillIcon = document.createElementNS("http://www.w3.org/2000/svg", "text");
            drillIcon.setAttribute("x", comp.x + comp.width - 24);
            drillIcon.setAttribute("y", comp.y + 22);
            drillIcon.setAttribute("font-size", "11");
            drillIcon.setAttribute("fill", "var(--accent-cyan)");
            drillIcon.textContent = "↗";
            g.appendChild(drillIcon);
          }

          // Hover Interactivity: Connected edges & cards trace
          g.addEventListener("mouseenter", () => highlightTrace(comp.id));
          g.addEventListener("mouseleave", () => clearTrace());

          // Click Interactivity: Drill-down or inspect
          g.addEventListener("click", () => {
            if (comp.targetViewId && STATE.viewsById[comp.targetViewId]) {
              selectView(comp.targetViewId, true);
            }
          });

          dom.viewportGroup.appendChild(g);
        });
      }

      // Render Sequence Diagram
      function renderSequenceDiagram(view) {
        const participants = view.participants || [];
        const messages = view.messages || [];
        const blocks = view.blocks || [];

        const startX = 60;
        const partWidth = 180;
        const partGap = 90;
        const startY = 40;
        const partHeight = 50;
        const msgStepY = 56;

        const partXMap = {};

        // 1. Draw Participants Cards at Top & Bottom
        participants.forEach((p, idx) => {
          const px = startX + idx * (partWidth + partGap);
          partXMap[p.id] = px + partWidth / 2;

          // Top card
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.className.baseVal = "seq-participant";

          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.className.baseVal = "node-card";
          rect.setAttribute("x", px);
          rect.setAttribute("y", startY);
          rect.setAttribute("width", partWidth);
          rect.setAttribute("height", partHeight);
          rect.style.stroke = "var(--accent-cyan)";
          g.appendChild(rect);

          const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          txt.className.baseVal = "node-title";
          txt.setAttribute("x", px + partWidth / 2);
          txt.setAttribute("y", startY + partHeight / 2);
          txt.setAttribute("text-anchor", "middle");
          txt.textContent = p.label || p.id;
          g.appendChild(txt);

          dom.viewportGroup.appendChild(g);
        });

        const totalHeight = startY + partHeight + (messages.length + 2) * msgStepY + 40;

        // 2. Lifelines
        participants.forEach(p => {
          const cx = partXMap[p.id];
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.className.baseVal = "seq-lifeline";
          line.setAttribute("x1", cx);
          line.setAttribute("y1", startY + partHeight);
          line.setAttribute("x2", cx);
          line.setAttribute("y2", totalHeight);
          dom.viewportGroup.appendChild(line);
        });

        // 3. Conditional / Loop Blocks (alt / else / loop)
        blocks.forEach(b => {
          const bY1 = startY + partHeight + b.startIdx * msgStepY + 10;
          const bY2 = startY + partHeight + (b.endIdx + 1) * msgStepY + 10;
          const bX1 = startX - 20;
          const bX2 = startX + participants.length * (partWidth + partGap) - partGap + 20;

          const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          bgRect.className.baseVal = "seq-box";
          bgRect.setAttribute("x", bX1);
          bgRect.setAttribute("y", bY1);
          bgRect.setAttribute("width", bX2 - bX1);
          bgRect.setAttribute("height", bY2 - bY1);
          bgRect.setAttribute("rx", "6");
          dom.viewportGroup.appendChild(bgRect);

          // Box label pill
          const pill = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          pill.className.baseVal = "seq-box-pill";
          pill.setAttribute("x", bX1 + 10);
          pill.setAttribute("y", bY1 - 10);
          pill.setAttribute("width", Math.max(60, (b.type + ": " + b.condition).length * 7 + 16));
          pill.setAttribute("height", 20);
          pill.setAttribute("rx", "4");
          dom.viewportGroup.appendChild(pill);

          const pillTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          pillTxt.className.baseVal = "seq-box-text";
          pillTxt.setAttribute("x", bX1 + 18);
          pillTxt.setAttribute("y", bY1);
          pillTxt.textContent = `${b.type}: ${b.condition || ""}`;
          dom.viewportGroup.appendChild(pillTxt);
        });

        // 4. Messages
        messages.forEach((m, idx) => {
          const my = startY + partHeight + (idx + 1) * msgStepY;
          const x1 = partXMap[m.from] || startX;
          const x2 = partXMap[m.to] || (startX + partWidth);

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.className.baseVal = "seq-msg";

          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.className.baseVal = "edge-line";
          line.setAttribute("x1", x1);
          line.setAttribute("y1", my);
          line.setAttribute("x2", x2);
          line.setAttribute("y2", my);
          line.style.stroke = "var(--edge-stroke)";
          if (m.dashed) {
            line.style.strokeDasharray = "5 4";
          }
          line.setAttribute("marker-end", "url(#arrow-cyan)");
          g.appendChild(line);

          // Label
          const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          txt.className.baseVal = "edge-label";
          txt.setAttribute("x", (x1 + x2) / 2);
          txt.setAttribute("y", my - 10);
          txt.setAttribute("text-anchor", "middle");
          txt.textContent = `${idx + 1}. ${m.label || ""}`;
          g.appendChild(txt);

          dom.viewportGroup.appendChild(g);
        });
      }

      // 7. Legend Renderer
      function renderLegend(view) {
        dom.legend.innerHTML = `<span class="legend-title">Leyenda</span>`;
        const activeRoles = new Set();

        if (view.components) {
          view.components.forEach(c => {
            if (c.role) activeRoles.add(c.role);
          });
        }

        if (activeRoles.size === 0) {
          activeRoles.add("frontend");
          activeRoles.add("backend");
          activeRoles.add("database");
          activeRoles.add("cloud");
        }

        activeRoles.forEach(r => {
          const info = ROLE_PALETTE[r] || { color: "#64748b", label: r };
          const item = document.createElement("div");
          item.className = "legend-item";
          item.innerHTML = `
            <span class="legend-dot" style="background: ${info.color};"></span>
            <span>${info.label}</span>
          `;
          dom.legend.appendChild(item);
        });
      }

      // 8. Inspector Renderer (Details, Invariants, ADRs)
      function renderInspector(view) {
        const tab = STATE.inspectorTab;
        dom.inspectorContent.innerHTML = "";

        if (tab === "adrs" || view.id === "adrs") {
          // Render ADRs Table
          renderAdrsTable();
          return;
        }

        if (tab === "invariants") {
          // Render Invariants Table for current view / flow
          renderInvariantsTable(view);
          return;
        }

        // Default: Flow Summary & Scripts
        renderFlowSummary(view);
      }

      function renderFlowSummary(view) {
        const flowMeta = view.flow_meta || {};
        const grid = document.createElement("div");
        grid.className = "flow-cards-grid";

        // Card 1: Entrada -> Proceso -> Salida
        const epsCard = document.createElement("div");
        epsCard.className = "meta-card";
        epsCard.innerHTML = `
          <div class="meta-card-label">Entrada → Proceso → Salida</div>
          <div class="meta-card-content">
            ${flowMeta.pipeline || view.description || "Flujo de arquitectura del sistema."}
          </div>
        `;
        grid.appendChild(epsCard);

        // Card 2: Scripts Involucrados
        const scriptsCard = document.createElement("div");
        scriptsCard.className = "meta-card";
        const scripts = flowMeta.scripts || view.scripts || [];
        const scriptsHtml = scripts.length > 0
          ? scripts.map(s => `<span class="script-tag" title="Click para copiar">${escapeHtml(s)}</span>`).join(" ")
          : '<span style="color: var(--text-muted);">Ningún script asociado directamente.</span>';

        scriptsCard.innerHTML = `
          <div class="meta-card-label">Scripts &amp; Comandos</div>
          <div class="meta-card-content">
            ${scriptsHtml}
          </div>
        `;
        grid.appendChild(scriptsCard);

        dom.inspectorContent.appendChild(grid);

        // Add copy-to-clipboard on script tags
        dom.inspectorContent.querySelectorAll(".script-tag").forEach(el => {
          el.addEventListener("click", () => {
            navigator.clipboard.writeText(el.textContent.trim());
            const orig = el.textContent;
            el.textContent = "✓ Copiado";
            setTimeout(() => { el.textContent = orig; }, 1200);
          });
        });
      }

      function renderInvariantsTable(view) {
        const invariants = (view.flow_meta && view.flow_meta.invariants) || view.invariants || [];
        if (invariants.length === 0) {
          dom.inspectorContent.innerHTML = `
            <div style="color: var(--text-muted); font-size: 0.85rem; padding: 8px;">
              No hay invariantes específicas declaradas para esta vista.
            </div>
          `;
          return;
        }

        const table = document.createElement("table");
        table.className = "data-table";
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width: 25%;">Regla / Invariante</th>
              <th>Descripción y Justificación</th>
            </tr>
          </thead>
          <tbody>
            ${invariants.map(inv => `
              <tr>
                <td style="font-weight: 600; color: var(--accent-cyan);">${escapeHtml(inv.name)}</td>
                <td>${escapeHtml(inv.description)}</td>
              </tr>
            `).join("")}
          </tbody>
        `;
        dom.inspectorContent.appendChild(table);
      }

      function renderAdrsTable() {
        const adrs = DATA.adrs || [];
        if (adrs.length === 0) {
          dom.inspectorContent.innerHTML = `
            <div style="color: var(--text-muted); font-size: 0.85rem; padding: 8px;">
              No hay decisiones arquitectónicas (ADRs) registradas en el documento.
            </div>
          `;
          return;
        }

        const table = document.createElement("table");
        table.className = "data-table";
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width: 30%;">Decisión Tomada</th>
              <th style="width: 30%;">Alternativa Descartada</th>
              <th>Razón Principal</th>
            </tr>
          </thead>
          <tbody>
            ${adrs.map(adr => `
              <tr>
                <td style="font-weight: 600; color: var(--accent-cyan);">${escapeHtml(adr.decision)}</td>
                <td style="color: var(--text-secondary);">${escapeHtml(adr.alternative)}</td>
                <td>${escapeHtml(adr.rationale)}</td>
              </tr>
            `).join("")}
          </tbody>
        `;
        dom.inspectorContent.appendChild(table);
      }

      // 9. Hover Trace (Highlight connected nodes & edges)
      function highlightTrace(nodeId) {
        const connectedEdges = document.querySelectorAll(`[data-from="${nodeId}"], [data-to="${nodeId}"]`);
        const connectedNodeIds = new Set([nodeId]);

        connectedEdges.forEach(e => {
          connectedNodeIds.add(e.getAttribute("data-from"));
          connectedNodeIds.add(e.getAttribute("data-to"));
        });

        // Dim everything
        document.querySelectorAll(".arch-node, .arch-edge").forEach(el => {
          el.classList.add("dimmed");
          el.classList.remove("highlighted");
        });

        // Highlight connected
        connectedNodeIds.forEach(id => {
          const n = document.querySelector(`.arch-node[data-id="${id}"]`);
          if (n) {
            n.classList.remove("dimmed");
            n.classList.add("highlighted");
          }
        });

        connectedEdges.forEach(e => {
          e.classList.remove("dimmed");
          e.classList.add("highlighted");
        });
      }

      function clearTrace() {
        document.querySelectorAll(".arch-node, .arch-edge").forEach(el => {
          el.classList.remove("dimmed");
          el.classList.remove("highlighted");
        });
      }

      // 10. Pan & Zoom Engine
      function setupPanZoom() {
        const svg = dom.canvasSvg;
        const group = dom.viewportGroup;

        svg.addEventListener("mousedown", (e) => {
          if (e.target.closest(".arch-node") || e.target.closest(".control-btn")) return;
          STATE.panZoom.isPanning = true;
          STATE.panZoom.startX = e.clientX - STATE.panZoom.x;
          STATE.panZoom.startY = e.clientY - STATE.panZoom.y;
        });

        window.addEventListener("mousemove", (e) => {
          if (!STATE.panZoom.isPanning) return;
          STATE.panZoom.x = e.clientX - STATE.panZoom.startX;
          STATE.panZoom.y = e.clientY - STATE.panZoom.startY;
          updateTransform();
        });

        window.addEventListener("mouseup", () => {
          STATE.panZoom.isPanning = false;
        });

        svg.addEventListener("wheel", (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
          zoomAtPoint(zoomFactor, e.clientX, e.clientY);
        }, { passive: false });
      }

      function zoomAtPoint(factor, clientX, clientY) {
        const rect = dom.canvasSvg.getBoundingClientRect();
        const mouseX = clientX - rect.left;
        const mouseY = clientY - rect.top;

        const newScale = Math.max(0.15, Math.min(4.0, STATE.panZoom.scale * factor));
        STATE.panZoom.x = mouseX - (mouseX - STATE.panZoom.x) * (newScale / STATE.panZoom.scale);
        STATE.panZoom.y = mouseY - (mouseY - STATE.panZoom.y) * (newScale / STATE.panZoom.scale);
        STATE.panZoom.scale = newScale;
        updateTransform();
      }

      function updateTransform() {
        const pz = STATE.panZoom;
        dom.viewportGroup.setAttribute(
          "transform",
          `matrix(${pz.scale} 0 0 ${pz.scale} ${pz.x} ${pz.y})`
        );
      }

      function fitCanvas() {
        const bbox = dom.viewportGroup.getBBox();
        if (!bbox || bbox.width === 0 || bbox.height === 0) return;

        const containerRect = dom.canvasContainer.getBoundingClientRect();
        const pad = 60;
        const availableW = Math.max(100, containerRect.width - pad * 2);
        const availableH = Math.max(100, containerRect.height - pad * 2);

        const scaleX = availableW / bbox.width;
        const scaleY = availableH / bbox.height;
        const scale = Math.min(1.2, Math.max(0.3, Math.min(scaleX, scaleY)));

        STATE.panZoom.scale = scale;
        STATE.panZoom.x = (containerRect.width - bbox.width * scale) / 2 - bbox.x * scale;
        STATE.panZoom.y = (containerRect.height - bbox.height * scale) / 2 - bbox.y * scale;

        updateTransform();
      }

      // 11. Search Engine (Ctrl+K)
      function setupSearch() {
        dom.btnSearch.addEventListener("click", openSearch);
        window.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            openSearch();
          } else if (e.key === "/" && document.activeElement !== dom.searchInput) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (dom.searchModal.classList.contains("active")) {
              closeSearch();
            } else if (dom.breadcrumbs.classList.contains("visible")) {
              // Return to master map on Esc
              selectView(STATE.previousViewId || "mapa-maestro", false);
            }
          }
        });

        dom.searchModal.addEventListener("click", (e) => {
          if (e.target === dom.searchModal) closeSearch();
        });

        dom.searchInput.addEventListener("input", (e) => {
          renderSearchResults(e.target.value.trim());
        });

        dom.searchInput.addEventListener("keydown", (e) => {
          const items = dom.searchResults.querySelectorAll(".search-result-item");
          if (e.key === "ArrowDown") {
            e.preventDefault();
            STATE.selectedSearchIdx = Math.min(items.length - 1, STATE.selectedSearchIdx + 1);
            updateSelectedSearchItem(items);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            STATE.selectedSearchIdx = Math.max(0, STATE.selectedSearchIdx - 1);
            updateSelectedSearchItem(items);
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (items[STATE.selectedSearchIdx]) {
              items[STATE.selectedSearchIdx].click();
            }
          }
        });
      }

      function openSearch() {
        dom.searchModal.classList.add("active");
        dom.searchInput.value = "";
        dom.searchInput.focus();
        renderSearchResults("");
      }

      function closeSearch() {
        dom.searchModal.classList.remove("active");
      }

      function renderSearchResults(query) {
        dom.searchResults.innerHTML = "";
        STATE.selectedSearchIdx = 0;

        let results = DATA.search_index || [];
        if (query) {
          const q = query.toLowerCase();
          results = results.filter(item => {
            return (item.title && item.title.toLowerCase().includes(q)) ||
                   (item.subtitle && item.subtitle.toLowerCase().includes(q)) ||
                   (item.category && item.category.toLowerCase().includes(q));
          });
        }

        if (results.length === 0) {
          dom.searchResults.innerHTML = `
            <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
              No se encontraron coincidencias para "${escapeHtml(query)}".
            </div>
          `;
          return;
        }

        results.slice(0, 20).forEach((res, idx) => {
          const div = document.createElement("div");
          div.className = "search-result-item" + (idx === 0 ? " selected" : "");
          div.innerHTML = `
            <div class="search-result-top">
              <span class="search-result-title">${escapeHtml(res.title)}</span>
              <span class="search-result-badge">${escapeHtml(res.category || "item")}</span>
            </div>
            <div class="search-result-desc">${escapeHtml(res.subtitle || "")}</div>
          `;
          div.addEventListener("click", () => {
            closeSearch();
            if (res.targetViewId) {
              selectView(res.targetViewId, true);
              if (res.nodeId) {
                setTimeout(() => highlightTrace(res.nodeId), 300);
              }
            }
          });
          dom.searchResults.appendChild(div);
        });
      }

      function updateSelectedSearchItem(items) {
        items.forEach((item, idx) => {
          if (idx === STATE.selectedSearchIdx) {
            item.classList.add("selected");
            item.scrollIntoView({ block: "nearest" });
          } else {
            item.classList.remove("selected");
          }
        });
      }

      // 12. Export Engine (SVG / PNG)
      function exportSvg() {
        const svgClone = dom.canvasSvg.cloneNode(true);
        // Include styling directly
        const style = document.createElement("style");
        style.textContent = `
          rect { shape-rendering: geometricPrecision; }
          text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        `;
        svgClone.prepend(style);
        const svgData = new XMLSerializer().serializeToString(svgClone);
        const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `arquitectura_${STATE.currentViewId || "blueprint"}.svg`;
        link.click();
        URL.revokeObjectURL(url);
      }

      function exportPng() {
        const svgData = new XMLSerializer().serializeToString(dom.canvasSvg);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
          canvas.width = dom.canvasSvg.clientWidth * 2;
          canvas.height = dom.canvasSvg.clientHeight * 2;
          ctx.scale(2, 2);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);

          const pngUrl = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.href = pngUrl;
          link.download = `arquitectura_${STATE.currentViewId || "blueprint"}.png`;
          link.click();
        };
        img.src = url;
      }

      // 13. Setup Event Listeners
      function setupEventListeners() {
        // Theme Toggle
        dom.btnTheme.addEventListener("click", () => {
          STATE.theme = STATE.theme === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", STATE.theme);
          dom.themeIcon.textContent = STATE.theme === "dark" ? "☀️" : "🌙";
          dom.themeText.textContent = STATE.theme === "dark" ? "LIGHT" : "DARK";
        });

        // Live Toggle
        dom.btnLive.addEventListener("click", () => {
          STATE.liveMode = !STATE.liveMode;
          dom.btnLive.classList.toggle("active", STATE.liveMode);
          document.querySelectorAll(".arch-edge").forEach(e => {
            e.classList.toggle("live", STATE.liveMode);
          });
        });

        // Breadcrumb back button & home
        dom.bcHome.addEventListener("click", () => selectView("mapa-maestro", false));
        dom.btnBcBack.addEventListener("click", () => selectView(STATE.previousViewId || "mapa-maestro", false));

        // Canvas Controls
        dom.btnZoomIn.addEventListener("click", () => {
          const rect = dom.canvasSvg.getBoundingClientRect();
          zoomAtPoint(1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
        });

        dom.btnZoomOut.addEventListener("click", () => {
          const rect = dom.canvasSvg.getBoundingClientRect();
          zoomAtPoint(0.8, rect.left + rect.width / 2, rect.top + rect.height / 2);
        });

        dom.btnZoomFit.addEventListener("click", fitCanvas);

        dom.btnToggleSidebar.addEventListener("click", () => {
          STATE.sidebarOpen = !STATE.sidebarOpen;
          dom.sidebar.classList.toggle("collapsed", !STATE.sidebarOpen);
        });

        // Exports
        dom.btnExportSvg.addEventListener("click", exportSvg);
        dom.btnExportPng.addEventListener("click", exportPng);

        // Inspector Header Toggle
        dom.inspectorHeader.addEventListener("click", (e) => {
          if (e.target.closest(".inspector-tab")) return;
          STATE.inspectorOpen = !STATE.inspectorOpen;
          dom.inspectorPanel.classList.toggle("minimized", !STATE.inspectorOpen);
          dom.inspectorToggleIcon.textContent = STATE.inspectorOpen ? "▾" : "▸";
        });

        // Inspector Tabs
        dom.inspectorTabs.querySelectorAll(".inspector-tab").forEach(tab => {
          tab.addEventListener("click", () => {
            dom.inspectorTabs.querySelectorAll(".inspector-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            STATE.inspectorTab = tab.getAttribute("data-tab");
            renderInspector(STATE.viewsById[STATE.currentViewId] || {});
          });
        });

        setupSearch();
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Run on DOM ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
